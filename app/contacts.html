<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/bootstrap-utilities.min.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
    <div class="row" style="height: 100vh">
        <div class="col-2 bg-dark text-white">
            <div class="row mt-3">
                <div class="col-2 ms-2">
                    <img src="/img/bootstrap.svg" alt="Logo" width="30" height="30">
                </div>
                <div class="col-1 mt-1">
                    <p class="fw-bold">Меню</p>
                </div>
            </div>
            <ul class="group mt-2">
                <li class="list-group-item" aria-current="true">
                  <img src="/img/house-door.svg" alt="Logo" width="20" height="20" class="d-inline-block align-text-top">
                  <button type="button" class="btn text-white">Главная</button> </li>
                <li class="list-group-item text-white mt-1">
                  <img src="/img/speedometer2.svg" alt="Logo" width="18" height="18" class="d-inline-block align-text-top">
                  <button type="button" class="btn text-white">Категории</button></li>
                <li class="list-group-item text-white mt-1">
                  <img src="/img/cart4.svg" alt="Logo" width="20" height="20" class="d-inline-block align-text-top">
                  <button type="button" class="btn text-white">Заказы</button></li>
                <li class="list-group-item text-white mt-1">
                  <img src="/img/person.svg" alt="Logo" width="20" height="20" class="d-inline-block align-text-top">
                  <button type="button" class="btn text-white">Контакты</button></li>
            </ul>
            <div class="fixed-bottom" style="width: 16.4%">
                <select class="form-select bg-dark text-white">
                    <option>Пользователь</option>
                    <option value="1">Профиль</option>
                    <option value="2">Выход</option>
                </select>
            </div>
        </div>
        <div class="col-10 mt-5">
            <div class="row mt-5 text-center">
                <h1>Главная</h1>
            </div>
            <div class="row mt-5">
                <div class="col-6 mt-5">
                    <div class="card ms-5" style="width: 30rem; height: 105%">
                        <form>
                         <div class="mb-3">
                             <label for="exampleFormControlTextarea1" class="form-label mt-2 ms-2">Имя</label>
                             <input class="form-control" type="text"  aria-label="default input example">
                             <label for="exampleFormControlInput1" class="form-label ms-2">Почта</label>
                             <input type="email" class="form-control" id="exampleFormControlInput1">
                             <label for="exampleFormControlTextarea1" class="form-label mt-3 ms-2">Сообщение</label>
                             <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                         </div>
                          <button type="submit" class="btn btn-primary ms-2">Отправить</button>
                        </form>
                    </div>
                </div>
                <div class="col-6">
                    <div class="row mt-5">
                        <h2>Наши контакты</h2>
                        <p class="text-start mt-2" style="width: 30rem">Это просто текст для заполнения страцы контакты,
                            а так же проверка на распределение в колонке и заполненение содержимого.
                        Хотя по хорошему тут должна быть информация о наших контактах...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
